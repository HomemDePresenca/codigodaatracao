<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Código da Atração | A Ciência do Desejo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* RESET & BASE STYLES */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-deep: #030303;
            --bg-card: #080808;
            --red-main: #C1121F;
            --red-dusk: #7A0A12;
            --red-glow: #E63946;
            --white-main: #F5F5F5;
            --white-sec: #8A8A8A;
            --font-heading: 'Bebas Neue', sans-serif;
            --font-body: 'Inter', sans-serif;
            --border-subtle: rgba(255, 255, 255, 0.04);
            --border-highlight: rgba(193, 18, 31, 0.3);
        }

        html {
            scroll-behavior: smooth;
            background-color: var(--bg-deep);
            color: var(--white-main);
            font-family: var(--font-body);
            overflow-x: hidden;
        }

        /* Respect safe area (notches) and keep previous spacing */
        body {
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-top: calc(env(safe-area-inset-top, 0px) + 64px);
        }

        /* Bloqueio de rolagem durante a animação */
        body.lock {
            overflow: hidden;
            height: 100vh;
            padding-top: 0;
        }

        /* =========================================
           ANIMAÇÃO INTRO (REFINADA & MOBILE-FIRST)
           ========================================= */
        #intro-overlay {
            position: fixed; inset: 0; z-index: 99999;
            background: radial-gradient(circle at 50% 40%, #0a0102 0%, var(--bg-deep) 80%);
            display: flex; align-items: center; justify-content: center;
            transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s;
        }
        #intro-overlay.fade-out { opacity: 0; visibility: hidden; pointer-events: none; }

        .grid-bg-intro {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(193, 18, 31, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(193, 18, 31, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridpan 40s linear infinite;
        }
        @keyframes gridpan {
            from { background-position: 0 0, 0 0; }
            to { background-position: 400px 0, 0 400px; }
        }

        .intro-stage {
            position: relative;
            width: min(85vw, 380px);
            aspect-ratio: 400/420;
            perspective: 1000px;
        }

        .bracket { position: absolute; width: 20px; height: 20px; border-color: var(--red-dusk); opacity: 0.8; }
        .bracket.tl { top: -10px; left: -10px; border-top: 1px solid; border-left: 1px solid; }
        .bracket.tr { top: -10px; right: -10px; border-top: 1px solid; border-right: 1px solid; }
        .bracket.bl { bottom: -10px; left: -10px; border-bottom: 1px solid; border-left: 1px solid; }
        .bracket.br { bottom: -10px; right: -10px; border-bottom: 1px solid; border-right: 1px solid; }

        .hud-label, .hud-pct {
            position: absolute; font-family: monospace; font-size: 10px;
            letter-spacing: 2px; color: var(--red-main); opacity: 0;
        }
        .hud-label { left: -10px; top: -30px; white-space: nowrap; }
        .hud-label.show { animation: hudflicker 0.6s ease forwards; }
        .hud-pct { right: -6px; bottom: -28px; font-size: 11px; }
        .hud-pct.show { opacity: 0.9; }

        @keyframes hudflicker { 0%{opacity:0;} 30%{opacity:1;} 50%{opacity:0.2;} 100%{opacity:0.9;} }

        #suit-svg {
            width: 100%; height: 100%; display: block; transform-style: preserve-3d;
            animation: spinIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        @keyframes spinIn {
            0% { transform: rotateY(-90deg) scale(0.85); opacity: 0; filter: blur(5px); }
            100% { transform: rotateY(0deg) scale(1); opacity: 1; filter: blur(0px); }
        }

        .draw {
            fill: none; stroke: rgba(255,255,255,0.15); stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
            transition: stroke-dashoffset 0.55s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease, filter 0.5s ease, stroke 0.5s ease;
        }
        .draw.accent { stroke: var(--red-main); stroke-width: 2.2; }

        #hBarL, #hBarR { transition: transform 0.55s cubic-bezier(0.16, 1, 0.3, 1); stroke: var(--white-main); stroke-width: 2.5; }
        #hBarL.split { transform: translateX(-90px); }
        #hBarR.split { transform: translateX(90px); }
        #crossbar { stroke: var(--red-main); stroke-width: 2.5; transition: opacity 0.5s ease; }
        #crossbar.hide { opacity: 0; }

        #text-reveal {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            flex-direction: column; pointer-events: none;
        }
        .reveal-text {
            opacity: 0; transform: scale(0.9);
            transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1), transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--white-main); font-family: var(--font-heading);
            letter-spacing: 3px; font-size: clamp(22px, 6vw, 32px); text-align: center; white-space: nowrap;
        }
        .reveal-text.show { opacity: 1; transform: scale(1); }
        .reveal-text .big-h { color: var(--red-main); font-size: 1.6em; }
        .reveal-rule {
            width: 0; height: 1px; background: var(--red-dusk); margin-top: 8px;
            transition: width 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.1s;
        }
        .reveal-rule.show { width: 140px; }

        .skip-btn {
            position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); right: 24px;
            font-family: monospace; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
            color: var(--white-sec); background: rgba(0,0,0,0.4); border: 1px solid var(--border-subtle);
            padding: 8px 16px; border-radius: 4px; cursor: pointer; opacity: 0; z-index: 2;
            transition: opacity 0.8s ease, color 0.3s, border-color 0.3s;
            backdrop-filter: blur(4px);
        }
        .skip-btn.show { opacity: 0.7; }
        .skip-btn:active { color: var(--red-main); border-color: var(--red-main); }

        /* VINHETA & PROFUNDIDADE */
        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(circle at center, transparent 20%, rgba(0,0,0,0.95) 100%);
        }

        /* BACKGROUND VIVO MINIMALISTA */
        .ambient-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0;
            background: radial-gradient(circle at 50% 10%, #0d0203 0%, var(--bg-deep) 70%);
        }
        .ambient-glow {
            position: absolute; top: -15%; left: 50%; width: 120vw; height: 50vh;
            background: radial-gradient(ellipse, rgba(193, 18, 31, 0.05) 0%, transparent 70%);
            pointer-events: none; animation: drift 20s ease-in-out infinite alternate;
        }

        @keyframes drift {
            0% { transform: translate(-50%, 0) scale(1); }
            100% { transform: translate(-48%, 2%) scale(1.05); }
        }

        /* PARTÍCULAS GEOMÉTRICAS */
        .particles-container { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .particle { position: absolute; color: var(--red-main); opacity: 0; font-family: monospace; font-size: 10px; animation: floatSymbol infinite linear; }
        .p1 { left: 15%; animation-duration: 25s; font-size: 12px; animation-delay: 0s; }
        .p2 { left: 85%; animation-duration: 30s; font-size: 14px; animation-delay: 4s; }
        .p3 { left: 45%; animation-duration: 28s; font-size: 10px; animation-delay: 8s; opacity: 0.05;}
        .p4 { left: 75%; animation-duration: 35s; font-size: 12px; animation-delay: 2s; }
        .p5 { left: 20%; animation-duration: 32s; font-size: 14px; animation-delay: 12s; }
        .p6 { left: 60%; animation-duration: 22s; font-size: 10px; animation-delay: 6s; }

        @keyframes floatSymbol {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            20% { opacity: 0.07; }
            80% { opacity: 0.07; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .cinematic-grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.03; pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFreque[...] )
        }

        /* Ensure main content sits above background elements */
        #main-content { opacity: 0; transition: opacity 0.5s ease; position: relative; z-index: 1; }
        #main-content.visible { opacity: 1; }
        .wrapper { max-width: 500px; margin: 0 auto; padding: 0 24px 120px 24px; position: relative; }

        h1, h2, h3 { font-family: var(--font-heading); text-transform: uppercase; letter-spacing: 1.5px; }

        .section-divider { width: 100px; height: 1px; margin: 60px auto; background: linear-gradient(90deg, transparent, rgba(193,18,31,.5), transparent); }

        .section-title { font-size: 38px; text-align: center; margin-bottom: 24px; color: var(--white-main); line-height: 1.1; }
        .section-title span { color: var(--red-main); }
        
        .svg-icon { stroke: var(--red-main); stroke-width: 1.5; fill: none; width: 28px; height: 28px; margin-bottom: 12px; }

        .scroll-reveal { opacity: 0; transform: translateY(25px); transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1); }
        .scroll-reveal.active { opacity: 1; transform: translateY(0); }
        .delay-1 { transition-delay: 0.15s; }

        /* URGENCY BAR */
        .top-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(10, 0, 0, 0.95); /* avoid heavy backdrop by default */
            border-bottom: 1px solid rgba(193, 18, 31, 0.2);
            color: #d1d1d1; text-align: center;
            padding: 8px 16px; z-index: 1000;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px;
        }
        .top-bar-row {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase;
        }
        .top-bar-row strong { color: var(--red-main); font-family: var(--font-heading); letter-spacing: 1px; font-size: 13px; font-weight: 400; }
        .top-bar-sub {
            font-size: 10px; color: #999; font-weight: 400; letter-spacing: 0.3px;
        }
        .top-bar-sub strong { color: var(--red-main); font-weight: 600; }
        .pulse-dot { width: 8px; height: 8px; background-color: var(--red-main); border-radius: 50%; box-shadow: 0 0 8px var(--red-main); animation: pulse-dot 1.5s infinite alternate; flex-shrink: 0; }
        @keyframes pulse-dot { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

        /* HERO */
        .hero { padding: 60px 0 20px; text-align: center; }
        .hero h1 { font-size: 64px; line-height: 0.85; margin-bottom: 24px; letter-spacing: 2px; }
        .hero h1 span.white { display: block; color: #fff; }
        .hero h1 span.red { display: block; color: var(--red-main); }
        .hero .subheadline { font-size: 15px; color: var(--white-sec); max-width: 360px; margin: 0 auto 40px; line-height: 1.6; font-weight: 300; }

        /* BOTÃO GLOBAL */
        .btn {
            display: flex; justify-content: center; align-items: center; gap: 12px; width: 100%;
            background: var(--red-main); color: #fff; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px;
            padding: 22px; border-radius: 4px; border: none; cursor: pointer; text-decoration: none; text-align: center;
            box-shadow: 0 10px 30px rgba(193, 18, 31, 0.15); position: relative; overflow: hidden; transition: all 0.4s ease;
        }
        .btn:hover { background: #d61826; box-shadow: 0 15px 40px rgba(193, 18, 31, 0.25); transform: translateY(-2px); }
        .btn::before {
            content: ''; position: absolute; top: 0; left: -150%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transform: skewX(-25deg); animation: shine 4s infinite;
        }
        @keyframes shine { 0% { left: -150%; } 20%, 100% { left: 150%; } }
        .btn:active { transform: scale(0.98); }

        /* TIMELINE */
        .timeline { position: relative; padding-left: 28px; margin-top: 30px; }
        .timeline::before { content: ''; position: absolute; left: 7px; top: 10px; bottom: 10px; width: 1px; background: linear-gradient(to bottom, var(--red-main), rgba(193,18,31,0.05)); }
        .timeline-item { position: relative; margin-bottom: 35px; }
        .timeline-item::before { content: ''; position: absolute; left: -24px; top: 6px; width: 7px; height: 7px; background: var(--bg-deep); border: 1px solid var(--red-main); transform: rotate(45deg); }
        .timeline-item h4 { font-family: var(--font-body); color: #fff; font-size: 15px; margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .timeline-item p { font-size: 14px; color: var(--white-sec); line-height: 1.6; font-weight: 300; }

        /* COPY */
        .story-section p { font-size: 15px; color: var(--white-sec); margin-bottom: 24px; line-height: 1.7; font-weight: 300; }
        .story-section p strong { color: #fff; font-weight: 500; }
        .highlight-box { background: transparent; border-left: 2px solid var(--red-main); padding: 20px 24px; margin: 40px 0; font-style: italic; color: #d1d1d1; font-size: 16px; line-height: 1.6; }
        .target-list { list-style: none; padding: 0; margin-top: 32px; border-top: 1px solid var(--border-subtle); padding-top: 32px; }
        .target-list li { position: relative; padding-left: 28px; margin-bottom: 20px; font-size: 14px; color: var(--white-sec); line-height: 1.6; font-weight: 300; }
        .target-list li::before { content: '✖'; position: absolute; left: 0; top: 8px; width: 12px; height: 1px; background: var(--red-main); }

        /* ... remaining styles unchanged ... */

        /* STICKY CTA */
        .sticky-cta {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(3, 3, 3, 0.95); /* avoid heavy backdrop on small devices via media query */
            border-top: 1px solid rgba(193, 18, 31, 0.1); padding: 16px 24px;
            z-index: 100; transform: translateY(100%); transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .sticky-cta.visible { transform: translateY(0); }
        .sticky-container { max-width: 450px; margin: 0 auto; }

        @media (min-width: 501px) {
            .wrapper { max-width: 500px; }
            .sticky-cta { left: 50%; transform: translate(-50%, 100%); max-width: 500px; border-left: 1px solid var(--border-subtle); border-right: 1px solid var(--border-subtle); }
            .sticky-cta.visible { transform: translate(-50%, 0); }
        }

        /* Respect user preference for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
        }

        /* Mobile: reduce/disable heavy visual effects to improve performance */
        @media (max-width: 480px) {
            /* hide decorative particle and film grain layers on small devices */
            .particles-container, .cinematic-grain { display: none !important; }
            /* pause ambient glow animation to save CPU */
            .ambient-glow { animation: none !important; opacity: 0.65; }
            /* remove shine animation on buttons (cheap visual retained) */
            .btn::before { animation: none !important; }
            /* avoid backdrop-filters which are expensive */
            .skip-btn, .testimonial-card, .top-bar { backdrop-filter: none !important; }
            .highlight-box { backdrop-filter: none !important; }
            /* reduce intro grid movement */
            .grid-bg-intro { animation-duration: 120s !important; }
            /* reduce frequency of pulsing */
            .pulse-dot { animation: none !important; }
        }
    </style>
<script>

<body class="lock">

    <div id="intro-overlay">
        <div class="grid-bg-intro"></div>

        <div class="intro-stage">
            <span class="bracket tl"></span><span class="bracket tr"></span>
            <span class="bracket bl"></span><span class="bracket br"></span>
            <span class="hud-label" id="hudLabel">RENDERIZANDO_IDENTIDADE</span>
            <span class="hud-pct" id="hudPct">00%</span>

            <svg id="suit-svg" viewBox="0 0 400 420" xmlns="http://www.w3.org/2000/svg">
                <path class="draw" id="hBarL" d="M160,45 L160,310"/>
                <path class="draw" id="hBarR" d="M240,45 L240,310"/>
                <path class="draw" id="crossbar" d="M160,178 L240,178"/>
            </svg>

            <div id="text-reveal">
                <div class="reveal-text" id="revealText"><span class="big-h">H</span>OMEM DE PRESENÇA</div>
                <div class="reveal-rule" id="revealRule"></div>
            </div>
        </div>

        <button class="skip-btn" id="skipBtn">Pular ›</button>
    </div>

    <div id="main-content">
        <div class="top-bar">
            <div class="top-bar-row">
                <div class="pulse-dot"></div>
                Vagas com desconto expiram em <strong id="tb-timer">00:27:43</strong>
            </div>
            <div class="top-bar-sub" id="tb-exact"></div>
        </div>

        <div class="ambient-bg"><div class="ambient-glow"></div></div>
        <div class="particles-container">
            <div class="particle p1">◆</div><div class="particle p2">+</div>
            <div class="particle p3">▲</div><div class="particle p4">●</div>
            <div class="particle p5">◆</div><div class="particle p6">+</div>
        </div>
        <div class="cinematic-grain"></div>

        <div class="wrapper">
            
            <section class="hero scroll-reveal active">
                <h1>
                    <span class="white">Código</span>
                    <span class="red">da Atração</span>
                </h1>
                <p class="subheadline">A anatomia silenciosa do desejo. Decodifique os sinais que elas tentam esconder, assuma o controle da dinâmica e torne-se a única opção viável.</p>
                
                <a href="#oferta" class="btn">
                    Desbloquear Acesso
                </a>
            </section>

            <div class="section-divider"></div>

            <!-- rest of the content unchanged -->

        </div>
    </div>

    <!-- Non-invasive helper: add a class when user prefers reduced motion to allow CSS hooks */ -->
    <script>
        try {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                document.documentElement.classList.add('prefers-reduced-motion');
            }
        } catch (e) { /* ignore */ }
    </script>
</body>
